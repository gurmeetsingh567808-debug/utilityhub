
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>UtilityHub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root{
 --bg:#0b1020;
 --card:#121b30;
 --card2:#1b2741;
 --text:#f5f7ff;
 --muted:#929fba;
 --line:#27344f;
 --accent:#8875ff;
 --blue:#43b9f5;
 --shadow:0 12px 35px #0003;
}
*{box-sizing:border-box}
body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Inter,system-ui,Arial,sans-serif;
 transition:.2s;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{
 max-width:850px;
 margin:auto;
 padding:22px 17px 40px;
}
header{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:25px;
}
.brand{
 display:flex;
 align-items:center;
 gap:12px;
}
.logo{
 width:45px;height:45px;
 border-radius:15px;
 display:grid;place-items:center;
 background:linear-gradient(135deg,#8975ff,#36c5ec);
 box-shadow:0 5px 25px #7164ff55;
}
.logo svg{width:25px}
.brand h2{font-size:19px;margin:0}
.brand small{color:var(--muted);font-size:11px}
.iconbtn{
 background:var(--card);
 border:1px solid var(--line);
 color:var(--text);
 padding:11px;
 border-radius:13px;
}
.iconbtn svg{width:19px;height:19px}
.hero{
 padding:27px 23px;
 border:1px solid #464078;
 border-radius:23px;
 background:
 radial-gradient(circle at 90% 10%,#7766ff55,transparent 35%),
 linear-gradient(120deg,#25234d,#132b46);
 position:relative;
 overflow:hidden;
 margin-bottom:24px;
}
.hero .tag{
 color:#bcb2ff;
 font-size:11px;
 letter-spacing:2px;
 font-weight:700;
}
.hero h1{
 font-size:29px;
 line-height:1.18;
 margin:12px 0 9px;
}
.hero p{
 color:#c1cce1;
 font-size:13px;
 max-width:290px;
 line-height:1.6;
}
.hero .hero-icon{
 position:absolute;
 right:20px;
 top:35px;
 width:95px;
 opacity:.15;
}
.search{
 width:100%;
 padding:15px 16px;
 border-radius:14px;
 border:1px solid var(--line);
 background:var(--card);
 color:var(--text);
 outline:none;
 margin-bottom:24px;
}
.search:focus,.field input:focus,
.field textarea:focus,.field select:focus{
 border-color:var(--accent);
}
.heading{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin:0 2px 13px;
}
.heading h3{font-size:16px;margin:0}
.heading span{font-size:11px;color:var(--muted)}
.grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:12px;
}
.tool{
 text-align:left;
 background:linear-gradient(145deg,var(--card),#10182a);
 border:1px solid var(--line);
 border-radius:18px;
 padding:16px;
 color:var(--text);
 min-height:130px;
 transition:.2s;
}
.tool:active{transform:scale(.97)}
.tool:hover{border-color:var(--accent)}
.tool-icon{
 width:43px;height:43px;
 display:grid;place-items:center;
 border-radius:13px;
 background:var(--card2);
 color:#a99aff;
 margin-bottom:13px;
}
.tool-icon svg{width:22px;height:22px}
.tool b{font-size:13px;display:block}
.tool small{font-size:11px;color:var(--muted)}
.panel{
 display:none;
 margin-top:15px;
 padding:19px;
 border:1px solid var(--line);
 background:var(--card);
 border-radius:20px;
}
.panel.active{display:block}
.panel h2{font-size:19px;margin:15px 0}
.back{
 background:var(--card2);
 color:var(--text);
 border:1px solid var(--line);
 border-radius:10px;
 padding:9px 13px;
}
.field{margin:15px 0}
.field label{
 display:block;
 color:var(--muted);
 font-size:12px;
 margin-bottom:7px;
}
.field input,.field textarea,.field select{
 width:100%;
 padding:13px;
 border:1px solid var(--line);
 border-radius:12px;
 background:var(--bg);
 color:var(--text);
 outline:none;
}
.field textarea{min-height:100px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{
 border:0;
 border-radius:12px;
 padding:12px 16px;
 color:white;
 font-weight:650;
 background:linear-gradient(120deg,var(--accent),#587fff);
}
.btn.secondary{
 background:var(--card2);
 border:1px solid var(--line);
 color:var(--text);
}
.result{
 margin-top:15px;
 padding:14px;
 border:1px solid var(--line);
 background:var(--bg);
 border-radius:12px;
 overflow-wrap:anywhere;
 white-space:pre-wrap;
 min-height:45px;
 font-size:14px;
}
.result canvas,.result img{max-width:100%;height:auto}
.copy{margin-top:10px}
.hidden{display:none!important}
footer{
 text-align:center;
 margin-top:28px;
 color:var(--muted);
 font-size:11px;
}
@media(min-width:580px){
 .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
 .hero h1{font-size:36px}
}
</style>
</head>

<body>
<div class="app">

<header>
 <div class="brand">
  <div class="logo">
   <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
    <path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4L12 2z"/>
   </svg>
  </div>
  <div>
   <h2>UtilityHub</h2>
   <small>Everyday tools, one place</small>
  </div>
 </div>
 <button class="iconbtn" id="themeBtn" aria-label="Toggle theme">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
   <circle cx="12" cy="12" r="4"/>
   <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>
  </svg>
 </button>
</header>

<main id="home">

<section class="hero">
 <div class="tag">YOUR SMART TOOLKIT</div>
 <h1>Make everyday tasks<br>feel effortless.</h1>
 <p>Simple, fast and useful tools — right inside Telegram.</p>
 <svg class="hero-icon" viewBox="0 0 100 100" fill="none" stroke="white" stroke-width="2">
  <path d="M50 5l10 35 35 10-35 10-10 35-10-35L5 50l35-10L50 5z"/>
 </svg>
</section>

<input class="search" id="search" placeholder="Search your tools...">

<div class="heading">
 <h3>Explore tools</h3>
 <span id="count">8 tools</span>
</div>

<div class="grid" id="tools">

<button class="tool" data-tool="calculator">
 <div class="tool-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 16h.01M12 16h.01M16 16h.01"/></svg></div>
 <b>Calculator</b><small>Quick calculations</small>
</button>

<button class="tool" data-tool="qr">
 <div class="tool-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM20 14v3m-6 4h3m4-4v4"/></svg></div>
 <b>QR Generator</b><small>Create QR codes</small>
</button>

<button class="tool" data-tool="units">
 <div class="tool-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l14-14 4 4L7 21zM7 13l3 3m1-7 3 3m1-7 3 3"/></svg></div>
 <b>Unit Converter</b><small>Convert measurements</small>
</button>

<button class="tool" data-tool="text">
 <div class="tool-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M12 5v14M8 19h8M7 9h10"/></svg></div>
 <b>Text Analyzer</b><small>Words and characters</small>
</button>

<button class="tool" data-tool="case">
 <div class="tool-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19L10 5l6 14M6 15h8M17 11h4m-2-2v11"/></svg></div>
 <b>Case Converter</b><small>Change text case</small>
</button>

<button class="tool" data-tool="percent">
 <div class="tool-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="7" r="3"/><circle cx="17" cy="17" r="3"/><path d="M19 5L5 19"/></svg></div>
 <b>Percentage</b><small>Percentage calculator</small>
</button>

<button class="tool" data-tool="color">
 <div class="tool-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 100 18h2a2 2 0 002-2c0-1-1-2-1-3 0-1 1-2 2-2h1a3 3 0 003-3 8 8 0 00-9-8z"/><circle cx="7" cy="10" r="1"/><circle cx="11" cy="7" r="1"/><circle cx="16" cy="9" r="1"/></svg></div>
 <b>Color Converter</b><small>HEX and RGB</small>
</button>

<button class="tool" data-tool="number">
 <div class="tool-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9h3m-1.5-1.5v5M15 9h2m-2 3h2M7 16h10"/></svg></div>
 <b>Number Base</b><small>Binary and hexadecimal</small>
</button>

</div>
</main>

<section class="panel" id="panel">
 <button class="back" id="back">← Back to tools</button>
 <div id="toolContent"></div>
</section>

<footer>UTILITYHUB · SIMPLE TOOLS FOR EVERYDAY LIFE</footer>
</div>

<script>
const tg=window.Telegram?.WebApp;
if(tg){
 tg.ready();
 tg.expand();
 tg.setHeaderColor?.('#0b1020');
 tg.setBackgroundColor?.('#0b1020');
}

const $=id=>document.getElementById(id);
const panel=$('panel');
const home=$('home');
const content=$('toolContent');

const templates={

calculator:`
<h2>Calculator</h2>
<div class="field">
<label>Expression</label>
<input id="expr" placeholder="Example: (25 + 5) * 2">
</div>
<button class="btn" onclick="calculate()">Calculate</button>
<div class="result" id="calcResult">Result will appear here.</div>`,

qr:`
<h2>QR Generator</h2>
<div class="field">
<label>Enter text or URL</label>
<textarea id="qrText" placeholder="Enter your text or website URL"></textarea>
</div>
<button class="btn" onclick="makeQR()">Generate QR</button>
<div class="result" id="qrResult">Your QR code will appear here.</div>`,

units:`
<h2>Unit Converter</h2>
<div class="field">
<label>Category</label>
<select id="unitType" onchange="unitOptions()">
<option value="length">Length</option>
<option value="weight">Weight</option>
<option value="temp">Temperature</option>
</select>
</div>
<div class="field"><label>Value</label><input id="unitValue" type="number" value="1"></div>
<div class="field"><label>From</label><select id="unitFrom"></select></div>
<div class="field"><label>To</label><select id="unitTo"></select></div>
<button class="btn" onclick="convertUnit()">Convert</button>
<div class="result" id="unitResult">Result will appear here.</div>`,

text:`
<h2>Text Analyzer</h2>
<div class="field">
<label>Your text</label>
<textarea id="textInput" oninput="analyzeText()" placeholder="Write or paste text here..."></textarea>
</div>
<div class="result" id="textResult">Characters: 0
Words: 0
Sentences: 0
Lines: 0</div>`,

case:`
<h2>Case Converter</h2>
<div class="field">
<label>Your text</label>
<textarea id="caseInput" placeholder="Enter text"></textarea>
</div>
<div class="actions">
<button class="btn" onclick="changeCase('upper')">UPPERCASE</button>
<button class="btn secondary" onclick="changeCase('lower')">lowercase</button>
<button class="btn secondary" onclick="changeCase('title')">Title Case</button>
<button class="btn secondary" onclick="changeCase('sentence')">Sentence Case</button>
</div>
<div class="result" id="caseResult">Result appears here.</div>
<button class="btn secondary copy" onclick="copyResult('caseResult')">Copy result</button>`,

percent:`
<h2>Percentage Calculator</h2>
<div class="field"><label>Percentage (X)</label><input id="pctX" type="number" placeholder="Example: 20"></div>
<div class="field"><label>Number (Y)</label><input id="pctY" type="number" placeholder="Example: 500"></div>
<button class="btn" onclick="percentage()">Calculate</button>
<div class="result" id="pctResult">Result will appear here.</div>`,

color:`
<h2>Color Converter</h2>
<div class="field"><label>HEX Color</label><input id="hex" value="#8875FF"></div>
<button class="btn" onclick="convertColor()">Convert</button>
<div class="result" id="colorResult">RGB result will appear here.</div>`,

number:`
<h2>Number Base Converter</h2>
<div class="field"><label>Decimal number</label><input id="decimal" type="number" placeholder="Enter a whole number"></div>
<button class="btn" onclick="numberBase()">Convert</button>
<div class="result" id="numberResult">Result will appear here.</div>`
};

function openTool(name){
 content.innerHTML=templates[name];
 home.classList.add('hidden');
 panel.classList.add('active');
 if(name==='units')unitOptions();
 if(tg?.BackButton){
  tg.BackButton.show();
  tg.BackButton.onClick(closeTool);
 }
}

function closeTool(){
 panel.classList.remove('active');
 home.classList.remove('hidden');
 tg?.BackButton?.hide();
}

document.querySelectorAll('[data-tool]').forEach(btn=>{
 btn.addEventListener('click',()=>openTool(btn.dataset.tool));
});

$('back').onclick=closeTool;

$('search').addEventListener('input',e=>{
 let q=e.target.value.toLowerCase(),count=0;
 document.querySelectorAll('.tool').forEach(btn=>{
  let show=btn.innerText.toLowerCase().includes(q);
  btn.classList.toggle('hidden',!show);
  if(show)count++;
 });
 $('count').textContent=count+' tools';
});

function calculate(){
 const s=$('expr').value.trim();
 if(!s)return $('calcResult').textContent='Enter an expression.';
 if(!/^[0-9+\-*/().%\s]+$/.test(s))
  return $('calcResult').textContent='Invalid expression.';
 try{
  const v=Function('"use strict";return ('+s+')')();
  $('calcResult').textContent=Number.isFinite(v)?String(v):'Invalid result.';
 }catch(e){
  $('calcResult').textContent='Could not calculate.';
 }
}

function makeQR(){
 let value=$('qrText').value.trim();
 let result=$('qrResult');
 result.innerHTML='';
 if(!value)return result.textContent='Enter text or URL first.';
 if(typeof QRCode==='undefined')
  return result.textContent='QR library unavailable. Check internet.';
 let holder=document.createElement('div');
 holder.style.cssText='background:white;padding:12px;display:inline-block;border-radius:10px';
 result.append(holder);
 new QRCode(holder,{
  text:value,width:200,height:200,
  correctLevel:QRCode.CorrectLevel.M
 });
}

const units={
 length:{Meter:1,Kilometer:1000,Centimeter:.01,Millimeter:.001,Mile:1609.344,Foot:.3048,Inch:.0254},
 weight:{Kilogram:1,Gram:.001,Milligram:.000001,Pound:.45359237,Ounce:.0283495}
};

function unitOptions(){
 let type=$('unitType').value;
 let options;
 if(type==='temp'){
  options=['Celsius','Fahrenheit','Kelvin'];
 }else{
  options=Object.keys(units[type]);
 }
 let html=options.map(x=>`<option>${x}</option>`).join('');
 $('unitFrom').innerHTML=html;
 $('unitTo').innerHTML=html;
 $('unitTo').selectedIndex=1;
}

function convertUnit(){
 let type=$('unitType').value;
 let v=Number($('unitValue').value);
 let a=$('unitFrom').value;
 let b=$('unitTo').value;
 if(!Number.isFinite(v))
  return $('unitResult').textContent='Enter a valid number.';
 let out;
 if(type==='temp'){
  let c=a==='Celsius'?v:a==='Fahrenheit'?(v-32)*5/9:v-273.15;
  out=b==='Celsius'?c:b==='Fahrenheit'?c*9/5+32:c+273.15;
 }else{
  out=v*units[type][a]/units[type][b];
 }
 $('unitResult').textContent=`${v} ${a} = ${Number(out.toFixed(8))} ${b}`;
}

function analyzeText(){
 let t=$('textInput').value;
 $('textResult').textContent=
 `Characters: ${t.length}
Characters without spaces: ${t.replace(/\s/g,'').length}
Words: ${(t.trim().match(/\S+/g)||[]).length}
Sentences: ${(t.match(/[.!?]+(?=\s|$)/g)||[]).length}
Lines: ${t?t.split(/\r\n|\r|\n/).length:0}`;
}

function changeCase(type){
 let t=$('caseInput').value,o=t;
 if(type==='upper')o=t.toUpperCase();
 if(type==='lower')o=t.toLowerCase();
 if(type==='title')o=t.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
 if(type==='sentence')o=t.toLowerCase().replace(/(^\s*\w|[.!?]\s+\w)/g,c=>c.toUpperCase());
 $('caseResult').textContent=o;
}

function percentage(){
 let x=Number($('pctX').value);
 let y=Number($('pctY').value);
 if($('pctX').value===''||$('pctY').value==='')
  return $('pctResult').textContent='Enter both numbers.';
 $('pctResult').textContent=`${x}% of ${y} = ${x/100*y}`;
}

function convertColor(){
 let h=$('hex').value.trim().replace('#','');
 if(!/^[0-9a-fA-F]{3}$|^[0-9a-fA-F]{6}$/.test(h))
  return $('colorResult').textContent='Enter a valid HEX color.';
 if(h.length===3)h=h.split('').map(c=>c+c).join('');
 let n=parseInt(h,16);
 let r=n>>16,g=(n>>8)&255,b=n&255;
 $('colorResult').innerHTML=
 `RGB: ${r}, ${g}, ${b}<br>HEX: #${h.toUpperCase()}<br>
 <span style="display:inline-block;width:55px;height:28px;border-radius:7px;background:#${h};vertical-align:middle"></span>`;
}

function numberBase(){
 let raw=$('decimal').value;
 let v=Number(raw);
 if(raw===''||!Number.isSafeInteger(v))
  return $('numberResult').textContent='Enter a valid whole number.';
 $('numberResult').textContent=
 `Binary: ${v.toString(2)}
Octal: ${v.toString(8)}
Hexadecimal: ${v.toString(16).toUpperCase()}`;
}

function copyResult(id){
 let text=$(id).innerText;
 if(navigator.clipboard?.writeText){
  navigator.clipboard.writeText(text)
   .then(()=>{if(tg?.HapticFeedback)tg.HapticFeedback.notificationOccurred('success')})
   .catch(()=>alert('Copy failed. Select and copy the text manually.'));
 }else{
  alert('Clipboard unavailable. Select and copy the text manually.');
 }
}

let light=false;
$('themeBtn').onclick=()=>{
 light=!light;
 const root=document.documentElement;
 const vars=light?{
  '--bg':'#f3f5fc',
  '--card':'#ffffff',
  '--card2':'#e8edfa',
  '--text':'#172039',
  '--muted':'#66728b',
  '--line':'#d9dfed',
  '--shadow':'0 12px 35px #0001'
 }:{
  '--bg':'#0b1020',
  '--card':'#121b30',
  '--card2':'#1b2741',
  '--text':'#f5f7ff',
  '--muted':'#929fba',
  '--line':'#27344f',
  '--shadow':'0 12px 35px #0003'
 };
 Object.entries(vars).forEach(([k,v])=>root.style.setProperty(k,v));
};
</script>
</body>
</html>
